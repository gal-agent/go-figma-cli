name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package all platforms
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then VERSION="$(git describe --tags --abbrev=0)"; fi
          VERSION="${VERSION#v}"
          echo "version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist staging
          package() {
            os=$1
            arch=$2
            binary=$3
            archive="figma-v${VERSION}-${os}-${arch}.zip"
            output="staging/${os}-${arch}/${binary}"
            echo "Building ${binary} (${os}/${arch})..."
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/gal-agent/go-figma-cli/internal/cli.version=$VERSION" \
              -o "$output" ./cmd/figma
            (cd "$(dirname "$output")" && zip -q "../../../dist/$archive" "$binary")
          }
          package windows amd64 figma.exe
          package windows arm64 figma.exe
          package linux   amd64 figma
          package linux   arm64 figma
          package darwin  amd64 figma
          package darwin  arm64 figma
          (cd dist && sha256sum *.zip > checksums.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*
