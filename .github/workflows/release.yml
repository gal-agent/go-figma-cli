name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"; fi
          echo "version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          build() {
            echo "Building $3 ($1/$2)..."
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w -X github.com/gal-agent/go-figma-cli/internal/cli.version=$VERSION" \
              -o "dist/$3" ./cmd/figma
          }
          build windows amd64 figma-windows-amd64.exe
          build windows arm64 figma-windows-arm64.exe
          build linux   amd64 figma-linux-amd64
          build linux   arm64 figma-linux-arm64
          build darwin  amd64 figma-darwin-amd64
          build darwin  arm64 figma-darwin-arm64
          (cd dist && sha256sum * > checksums.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*
