name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: |
          mkdir -p dist
          platforms=(
            "windows/amd64 figma-windows-amd64.exe"
            "windows/arm64 figma-windows-arm64.exe"
            "linux/amd64 figma-linux-amd64"
            "linux/arm64 figma-linux-arm64"
            "darwin/amd64 figma-darwin-amd64"
            "darwin/arm64 figma-darwin-arm64"
          )
          for entry in "${platforms[@]}"; do
            set -- $entry
            os=$1; arch=$2; name=$3
            echo "Building $name..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/gal-agent/go-figma-cli/internal/cli.version=${GITHUB_REF_NAME}" \
              -o "dist/$name" ./cmd/figma
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
